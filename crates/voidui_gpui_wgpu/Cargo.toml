[package]
name = "voidui_gpui_wgpu"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Standalone GPUI-derived WGPU renderer, scene, atlas and text system for voidui"
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
parley = { version = "=0.11.1", features = ["complex-scripts"] }
read-fonts = "0.41.0"
derive_more = { version = "2.1.1", features = ["add", "add_assign", "deref", "deref_mut", "from_str", "mul", "mul_assign", "not"] }
etagere = "0.2"
itertools = "0.14"
log = "0.4"
lyon = "1"
parking_lot = "0.12"
pollster = "0.4"
profiling = "1"
raw-window-handle = "0.6"
rustc-hash = "2"
schemars = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
smallvec = { version = "1", features = ["union", "const_new"] }
swash = "0.2.6"
unicode-segmentation = "1.10"
wgpu = "=29.0.4"

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { version = "=29.0.4", features = ["webgl"] }

[dev-dependencies]
rand = "0.9"
png = "0.18"
naga = { version = "29.0.4", features = ["wgsl-in"] }
winit = "0.30.13"

[target.'cfg(target_os = "linux")'.dependencies]
# Load the platform font service lazily; bundled-font applications and cross
# builds do not need host fontconfig headers or link against a host library.
fontique = { version = "=0.11.1", features = ["fontconfig-dlopen"] }
